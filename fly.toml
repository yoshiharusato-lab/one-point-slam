# fly.toml app configuration file generated for one-point-slam on 2026-08-23T16:56:56+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'one-point-slam'
primary_region = 'nrt'
console_command = '/rails/bin/rails console'

[build]

[mounts]
  source = "storage"
  destination = "/rails/storage"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
